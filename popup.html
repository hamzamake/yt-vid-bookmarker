<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 360px;
      margin: 0;
      font-family: Roboto, Arial, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid #272727;
      font-weight: 600;
    }
    #count { color: #aaa; font-weight: 400; margin-left: 4px; }
    #clear {
      background: none;
      border: 1px solid #3f3f3f;
      color: #aaa;
      border-radius: 12px;
      padding: 3px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    #clear:hover { color: #fff; border-color: #777; }
    .actions { display: flex; align-items: center; gap: 6px; }
    #settings {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
      padding: 2px 4px;
    }
    #settings:hover { color: #fff; }
    #refresh {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
      padding: 2px 4px;
    }
    #refresh:hover { color: #fff; }
    #refresh.spinning { animation: spin 0.8s linear infinite; color: #3ea6ff; cursor: default; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #sync-status { padding: 6px 14px 0; font-size: 11px; color: #888; text-align: center; }
    #sync-status[hidden] { display: none; }
    #sync-status.ok { color: #2ba640; }
    #sync-status.error { color: #ff4e45; }
    #search {
      display: block;
      box-sizing: border-box;
      width: calc(100% - 28px);
      margin: 10px 14px 4px;
      padding: 7px 12px;
      border: 1px solid #303030;
      border-radius: 16px;
      background: #121212;
      color: #f1f1f1;
      font-size: 13px;
      outline: none;
    }
    #search:focus { border-color: #3ea6ff; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; }
    li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-bottom: 1px solid #1f1f1f;
    }
    li:hover { background: #1a1a1a; }
    a {
      flex: 1;
      min-width: 0;
      display: flex;
      gap: 10px;
      align-items: center;
      color: inherit;
      text-decoration: none;
    }
    .thumb {
      position: relative;
      flex: none;
      width: 96px;
      height: 54px;
      border-radius: 6px;
      overflow: hidden;
      background: #272727;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.3); }
    .bar div { height: 100%; background: #3ea6ff; }
    .info { min-width: 0; }
    .title {
      font-size: 13px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .time { font-size: 12px; color: #3ea6ff; font-weight: 600; margin-top: 3px; }
    .meta { color: #888; font-weight: 400; }
    .delete {
      background: none;
      border: none;
      color: #777;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }
    .delete:hover { color: #fff; }
    .empty { padding: 24px 14px; color: #aaa; font-size: 13px; text-align: center; }
    #undo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: #1f1f1f;
      font-size: 13px;
    }
    #undo[hidden] { display: none; }
    #undo button {
      background: none;
      border: none;
      color: #3ea6ff;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    footer { padding: 8px 14px; color: #666; font-size: 11px; text-align: center; }
    kbd {
      border: 1px solid #444;
      border-radius: 3px;
      padding: 0 4px;
      font-family: inherit;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>
    <span>YouTube Bookmarks<span id="count"></span></span>
    <span class="actions">
      <button id="clear">Clear all</button>
      <button id="refresh" title="Refresh and sync now">↻</button>
      <button id="settings" title="Settings">⚙</button>
    </span>
  </header>
  <input id="search" type="search" placeholder="Search bookmarks" hidden>
  <ul id="list"></ul>
  <div id="undo" hidden><span id="undo-text"></span><button id="undo-btn">Undo</button></div>
  <div id="sync-status" hidden></div>
  <footer>Press <kbd>B</kbd> on a video to jump back to its bookmark</footer>
  <script src="popup.js"></script>
</body>
</html>
